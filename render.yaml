# ─────────────────────────────────────────────────────────────────────────────
# MediKiosk+ backend — Render Blueprint (web service definition)
#
# Create the service in Render:  New + → Blueprint  → select this repo.
# The blueprint auto-detects `render.yaml` at the repository root.
#
# SECRETS are deliberately NOT declared here (never commit credentials):
#   - JWT_SECRET          → generated by Render (generateValue: true)
#   - DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_SSL_CA  → attach the "medikiosk-prod"
#     Environment Group (create it in Render and set the values there)
#   - FRONTEND_URL        → set on the Environment Group too (it changes after
#     the Vercel frontend is live), plus optional provider keys
#     (SARVAM_*, GROQ_*, BHASHINI_*, ABDM_*, TWILIO_*).
# Blueprint-managed variables only hold values that never change; anything you
# need to edit on the dashboard lives on the Environment Group instead.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: medikiosk-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: medikiosk
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_LOG_OTP
        value: "false"
      - key: DEMO_ALLOW_REGISTRATION
        value: "false"
      - key: JWT_SECRET
        generateValue: true